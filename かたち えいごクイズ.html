<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かたち えいごクイズ</title>
<style>
  :root{
    --paper:#f7f2e9;
    --ink:#2a2a28;
    --muted:#5b5b57;
    --brand:#2b6cb0;
    --brand-deep:#1f4e79;
    --shape-fill:#cfe0f4;
    --shape-stroke:#2b6cb0;
    --correct:#2f855a;
    --correct-bg:#e6f4ea;
    --wrong:#c53030;
    --wrong-bg:#fbeae7;
    --card:#ffffff;
    --line:#d8d2c4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    background:var(--paper);
    color:var(--ink);
    font-size:20px;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:860px;margin:0 auto;padding:24px 18px 60px;}

  h1{
    font-size:40px;
    text-align:center;
    margin:8px 0 4px;
    color:var(--brand-deep);
    letter-spacing:.02em;
  }
  .lead{text-align:center;font-size:21px;color:var(--muted);margin:0 0 26px;}

  .shape{fill:var(--shape-fill);stroke:var(--shape-stroke);stroke-width:4;stroke-linejoin:round;}

  .hero{
    display:flex;justify-content:center;flex-wrap:wrap;gap:10px;
    margin:0 auto 30px;
  }
  .hero svg{width:88px;height:74px;}

  .mode-title{font-size:22px;text-align:center;color:var(--ink);margin:0 0 16px;font-weight:700;}
  .modes{display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto;}
  .mode-btn{
    display:flex;align-items:center;gap:18px;
    background:var(--card);
    border:3px solid var(--brand);
    border-radius:18px;
    padding:20px 22px;
    cursor:pointer;
    text-align:left;
    transition:transform .08s ease, background .15s ease;
    width:100%;
  }
  .mode-btn:hover{background:#eef4fb;}
  .mode-btn:active{transform:scale(.99);}
  .mode-btn .icon{font-size:34px;line-height:1;flex:0 0 auto;}
  .mode-btn .txt b{display:block;font-size:26px;color:var(--brand-deep);}
  .mode-btn .txt span{font-size:18px;color:var(--muted);}

  .bar{
    display:flex;justify-content:space-between;align-items:center;
    font-size:22px;font-weight:700;color:var(--muted);
    border-bottom:2px solid var(--line);
    padding-bottom:12px;margin-bottom:22px;
  }
  .bar .score{color:var(--brand-deep);}

  .prompt{
    text-align:center;
    background:var(--card);
    border:3px solid var(--line);
    border-radius:20px;
    padding:22px 18px;
    margin-bottom:22px;
  }
  .prompt .ask{font-size:22px;color:var(--muted);margin:0 0 10px;}
  .prompt .word-kana{font-size:46px;font-weight:800;color:var(--brand-deep);line-height:1.2;}
  .prompt .word-en{font-size:30px;color:var(--ink);margin-top:2px;}
  .prompt .big-shape svg{width:190px;height:158px;}

  .options{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .opt{
    background:var(--card);
    border:3px solid var(--line);
    border-radius:18px;
    padding:18px 12px;
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:150px;
    transition:transform .08s ease, border-color .12s ease, background .12s ease;
  }
  .opt:hover:not(.locked){border-color:var(--brand);background:#eef4fb;}
  .opt:active:not(.locked){transform:scale(.98);}
  .opt svg{width:128px;height:106px;}
  .opt .w-kana{font-size:30px;font-weight:800;color:var(--brand-deep);line-height:1.25;}
  .opt .w-en{font-size:21px;color:var(--ink);}
  .opt.locked{cursor:default;}
  .opt.correct{border-color:var(--correct);background:var(--correct-bg);}
  .opt.wrong{border-color:var(--wrong);background:var(--wrong-bg);}
  .opt .mark{font-size:34px;font-weight:800;margin-top:6px;line-height:1;}
  .opt.correct .mark{color:var(--correct);}
  .opt.wrong .mark{color:var(--wrong);}

  .feedback{margin-top:22px;text-align:center;min-height:10px;}
  .fb-msg{font-size:30px;font-weight:800;margin:0 0 6px;}
  .fb-msg.ok{color:var(--correct);}
  .fb-msg.ng{color:var(--wrong);}
  .fb-ans{font-size:22px;color:var(--muted);margin:0 0 18px;}
  .fb-ans b{color:var(--ink);}

  .btn{
    display:inline-block;border:none;cursor:pointer;
    font-family:inherit;font-weight:800;
    border-radius:16px;padding:16px 40px;font-size:24px;
    transition:transform .08s ease, filter .12s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;color:var(--brand-deep);border:3px solid var(--brand);}
  .btn-ghost:hover{background:#eef4fb;}

  .quit{display:block;margin:30px auto 0;background:none;border:none;color:var(--muted);
    font-size:18px;text-decoration:underline;cursor:pointer;font-family:inherit;}

  .result{text-align:center;padding-top:20px;}
  .result .big{font-size:30px;font-weight:800;color:var(--brand-deep);margin:0 0 8px;}
  .result .score-line{font-size:56px;font-weight:800;color:var(--ink);margin:6px 0 4px;}
  .result .score-line small{font-size:26px;color:var(--muted);font-weight:700;}
  .result .msg{font-size:24px;color:var(--muted);margin:6px 0 30px;}
  .result .stars{font-size:44px;letter-spacing:.1em;margin:0 0 22px;}
  .result .actions{display:flex;flex-direction:column;gap:14px;max-width:420px;margin:0 auto;}

  .hidden{display:none !important;}

  @media (max-width:520px){
    h1{font-size:32px;}
    .prompt .word-kana{font-size:38px;}
    .prompt .word-en{font-size:25px;}
    .opt .w-kana{font-size:26px;}
    .btn{padding:14px 30px;font-size:22px;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
  :focus-visible{outline:4px solid #f0a500;outline-offset:2px;border-radius:8px;}
</style>
</head>
<body>
<div class="wrap">

  <section id="start">
    <h1>かたち えいごクイズ</h1>
    <p class="lead">まる・さんかく・しかく…を えいごで おぼえましょう</p>

    <div class="hero" id="hero"></div>

    <p class="mode-title">やりかたを えらんでください</p>
    <div class="modes">
      <button class="mode-btn" onclick="startQuiz('word2shape')">
        <span class="icon">🔤→▱</span>
        <span class="txt"><b>ことば → かたち</b><span>ことばを見て、正しい形をえらぶ</span></span>
      </button>
      <button class="mode-btn" onclick="startQuiz('shape2word')">
        <span class="icon">▱→🔤</span>
        <span class="txt"><b>かたち → ことば</b><span>形を見て、正しいことばをえらぶ</span></span>
      </button>
      <button class="mode-btn" onclick="startQuiz('mix')">
        <span class="icon">🔀</span>
        <span class="txt"><b>ミックス</b><span>りょうほうが まざって出る</span></span>
      </button>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div class="bar">
      <span>もんだい <span id="qnum">1</span> / <span id="qtotal">10</span></span>
      <span class="score">せいかい <span id="score">0</span></span>
    </div>
    <div class="prompt" id="prompt"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="quit" onclick="goStart()">やめて さいしょにもどる</button>
  </section>

  <section id="result" class="hidden">
    <div class="result">
      <p class="big">おつかれさまでした！</p>
      <p class="stars" id="stars"></p>
      <p class="score-line"><span id="finalScore">0</span> <small>/ <span id="finalTotal">10</span> もん</small></p>
      <p class="msg" id="resultMsg"></p>
      <div class="actions">
        <button class="btn btn-primary" onclick="restart()">もう一度 おなじモード</button>
        <button class="btn btn-ghost" onclick="goStart()">モードを えらびなおす</button>
      </div>
    </div>
  </section>

</div>

<script>
/* ---- データ ---- */
const SHAPES = [
  { jp:'円',     en:'circle',   kana:'サークル',       inner:'<circle class="shape" cx="60" cy="50" r="38"/>' },
  { jp:'三角形', en:'triangle', kana:'トライアングル', inner:'<polygon class="shape" points="60,14 96,78 24,78"/>' },
  { jp:'四角形', en:'square',   kana:'スクエア',       inner:'<polygon class="shape" points="30,16 90,16 90,76 30,76"/>' },
  { jp:'五角形', en:'pentagon', kana:'ペンタゴン',     inner:'<polygon class="shape" points="60,12 98,40 84,84 36,84 22,40"/>' },
  { jp:'六角形', en:'hexagon',  kana:'ヘキサゴン',     inner:'<polygon class="shape" points="80,15 100,50 80,85 40,85 20,50 40,15"/>' },
  { jp:'八角形', en:'octagon',  kana:'オクタゴン',     inner:'<polygon class="shape" points="45,13 75,13 97,35 97,65 75,87 45,87 23,65 23,35"/>' },
];

const TOTAL = 10;

function svg(shape){
  return '<svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+shape.inner+'</svg>';
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pickOptions(correct){
  const others = shuffle(SHAPES.filter(s=>s!==correct)).slice(0,3);
  return shuffle([correct, ...others]);
}

let mode='mix', qIndex=0, score=0, answered=false;

const $ = id => document.getElementById(id);
function show(sec){ ['start','quiz','result'].forEach(s=>$(s).classList.toggle('hidden', s!==sec)); }
function goStart(){ show('start'); }
function startQuiz(m){ mode=m; qIndex=0; score=0; $('qtotal').textContent=TOTAL; show('quiz'); nextQuestion(); }
function restart(){ startQuiz(mode); }

function currentDirection(){
  if(mode==='mix') return Math.random()<0.5 ? 'word2shape':'shape2word';
  return mode;
}

function nextQuestion(){
  answered=false;
  $('feedback').innerHTML='';
  $('qnum').textContent=qIndex+1;
  $('score').textContent=score;

  const dir=currentDirection();
  const correct=SHAPES[Math.floor(Math.random()*SHAPES.length)];
  const opts=pickOptions(correct);
  const prompt=$('prompt'), options=$('options');
  options.innerHTML='';

  if(dir==='word2shape'){
    prompt.innerHTML=
      '<p class="ask">この ことばの かたちは？</p>'
      +'<div class="word-kana">'+correct.kana+'</div>'
      +'<div class="word-en">'+correct.en+'</div>';
    opts.forEach(s=>{
      const b=document.createElement('button');
      b.className='opt'; b.dataset.en=s.en;
      b.innerHTML=svg(s);
      b.onclick=()=>choose(b, s, correct);
      options.appendChild(b);
    });
  }else{
    prompt.innerHTML=
      '<p class="ask">この かたちの ことばは？</p>'
      +'<div class="big-shape">'+svg(correct)+'</div>';
    opts.forEach(s=>{
      const b=document.createElement('button');
      b.className='opt'; b.dataset.en=s.en;
      b.innerHTML='<div class="w-kana">'+s.kana+'</div><div class="w-en">'+s.en+'</div>';
      b.onclick=()=>choose(b, s, correct);
      options.appendChild(b);
    });
  }
}

function choose(btn, chosen, correct){
  if(answered) return;
  answered=true;
  const isCorrect = chosen.en===correct.en;
  const all=[...document.querySelectorAll('#options .opt')];
  all.forEach(o=>{
    o.classList.add('locked');
    if(o.dataset.en===correct.en){
      o.classList.add('correct');
      o.insertAdjacentHTML('beforeend','<div class="mark">○</div>');
    }
  });
  if(isCorrect){ score++; $('score').textContent=score; }
  else{ btn.classList.add('wrong'); btn.insertAdjacentHTML('beforeend','<div class="mark">✕</div>'); }

  const fb=$('feedback');
  fb.innerHTML=
    '<p class="fb-msg '+(isCorrect?'ok':'ng')+'">'+(isCorrect?'せいかい！':'ざんねん')+'</p>'
    +'<p class="fb-ans">こたえ： <b>'+correct.kana+' / '+correct.en+'</b>（'+correct.jp+'）</p>'
    +'<button class="btn btn-primary" id="nextBtn">'+(qIndex+1>=TOTAL?'けっかを見る':'つぎの もんだい')+'</button>';
  $('nextBtn').onclick=()=>{ qIndex++; if(qIndex>=TOTAL) showResult(); else nextQuestion(); };
  $('nextBtn').focus();
}

function showResult(){
  show('result');
  $('finalScore').textContent=score;
  $('finalTotal').textContent=TOTAL;
  const ratio=score/TOTAL;
  const filled=Math.round(ratio*5);
  $('stars').textContent='★'.repeat(filled)+'☆'.repeat(5-filled);
  let msg;
  if(ratio===1) msg='ぜんもん せいかい！ すばらしい！';
  else if(ratio>=0.7) msg='よくできました！';
  else if(ratio>=0.4) msg='その調子。もう一度ちょうせん！';
  else msg='くりかえすと おぼえられます。';
  $('resultMsg').textContent=msg;
}

$('hero').innerHTML=SHAPES.map(svg).join('');
</script>
</body>
</html>
