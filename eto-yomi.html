<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>干支（えと）の読みかた教室</title>
<style>
  :root{
    --washi:#f6efdf;      /* 和紙の地色 */
    --washi2:#efe6d1;
    --ink:#2b2620;        /* 墨 */
    --sub:#6f6455;        /* 薄墨 */
    --card:#fffdf6;
    --line:#ddd0b4;
    --moku:#2e7d32;       /* 木 みどり */
    --ka:#d23b2f;         /* 火 あか */
    --do:#b58a2b;         /* 土 きつち */
    --kin:#5f7d8c;        /* 金 しろがね */
    --sui:#1565c0;        /* 水 あお */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:
      radial-gradient(circle at 20% 15%, #fbf6ea 0%, transparent 55%),
      radial-gradient(circle at 85% 80%, #f1e7d0 0%, transparent 50%),
      var(--washi);
    color:var(--ink);
    min-height:100vh;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;}

  header{text-align:center;padding:8px 0 4px;}
  header h1{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:26px;font-weight:700;margin:0;letter-spacing:.04em;
  }
  header p{margin:4px 0 0;font-size:15px;color:var(--sub);}

  /* モード切り替え・カウンタ */
  .bar{
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;margin:14px 0 6px;
  }
  .modes{display:flex;gap:6px;}
  .mode{
    font-size:16px;padding:8px 14px;border-radius:999px;
    border:2px solid var(--line);background:var(--card);color:var(--sub);
    cursor:pointer;font-weight:700;
  }
  .mode.on{border-color:var(--ink);background:var(--ink);color:#fff;}
  .count{font-size:16px;color:var(--sub);font-weight:700;white-space:nowrap;}

  /* 札（ふだ） */
  .fuda{
    position:relative;background:var(--card);
    border:2px solid var(--line);border-radius:20px;
    box-shadow:0 6px 0 #e7dcc2, 0 10px 24px rgba(90,70,30,.12);
    padding:26px 20px 22px;margin-top:8px;text-align:center;
  }
  .no{
    position:absolute;top:12px;left:16px;
    font-size:15px;color:var(--sub);font-weight:700;
  }
  .kanji{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-weight:700;line-height:1;letter-spacing:.06em;
    font-size:120px;margin:14px 0 6px;color:var(--ink);
  }
  .ask{font-size:22px;color:var(--sub);margin:2px 0 4px;font-weight:700;}

  /* こたえ */
  .answer{display:none;margin-top:6px;}
  .answer.show{display:block;animation:pop .25s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .yomi{
    font-size:46px;font-weight:800;letter-spacing:.02em;
    margin:6px 0 2px;
  }
  .yomi .dot{color:var(--line);margin:0 .08em;font-weight:700;}
  .on{font-size:20px;color:var(--sub);margin:2px 0 14px;font-weight:700;}
  .on b{color:var(--ink);}

  .breakdown{
    display:flex;flex-direction:column;gap:8px;
    background:var(--washi2);border-radius:14px;
    padding:12px 12px;margin:2px 0 4px;text-align:left;
  }
  .row{display:flex;align-items:baseline;gap:10px;font-size:19px;}
  .badge{
    flex:none;min-width:2.4em;text-align:center;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-weight:700;font-size:26px;line-height:1.1;
    padding:2px 8px;border-radius:10px;color:#fff;
  }
  .row .txt{font-weight:700;}
  .row .txt small{display:block;font-size:15px;color:var(--sub);font-weight:700;}

  .mame{
    margin-top:10px;font-size:17px;color:var(--ink);
    background:#fff6e0;border:1px dashed var(--do);border-radius:12px;
    padding:10px 12px;text-align:left;line-height:1.6;
  }
  .mame b{color:var(--ka);}

  /* ボタン */
  .btns{margin-top:16px;display:flex;flex-direction:column;gap:12px;}
  button.big{
    font-family:inherit;font-size:24px;font-weight:800;
    padding:18px 16px;border-radius:16px;border:none;cursor:pointer;
    color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);
  }
  button.big:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15);}
  .reveal{background:var(--ka);}
  .next{background:var(--ink);}
  .hint{text-align:center;font-size:15px;color:var(--sub);margin-top:12px;}

  @media (max-width:380px){
    .kanji{font-size:96px;}
    .yomi{font-size:38px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>干支（えと）の読みかた教室</h1>
    <p>ぜんぶで 60通り　—　これは何と読む？</p>
  </header>

  <div class="bar">
    <div class="modes">
      <button class="mode on" id="mRandom">ランダム</button>
      <button class="mode" id="mOrder">じゅんばん</button>
    </div>
    <div class="count" id="count">1／60</div>
  </div>

  <div class="fuda" id="fuda">
    <div class="no" id="no">第1番</div>
    <div class="kanji" id="kanji">甲子</div>
    <div class="ask" id="ask">なんと読む？</div>

    <div class="answer" id="answer">
      <div class="yomi" id="yomi"></div>
      <div class="on" id="onyomi"></div>
      <div class="breakdown" id="breakdown"></div>
      <div class="mame" id="mame" style="display:none"></div>
    </div>
  </div>

  <div class="btns">
    <button class="big reveal" id="revealBtn">答えを見る</button>
    <button class="big next" id="nextBtn" style="display:none">つぎへ　▶</button>
  </div>
  <p class="hint">札をタップしても答えが出ます</p>
</div>

<script>
/* ===== 十干（じっかん） ===== */
const STEMS = [
  {k:'甲', kun:'きのえ',   on:'こう', go:'木', eto:'兄'},
  {k:'乙', kun:'きのと',   on:'おつ', go:'木', eto:'弟'},
  {k:'丙', kun:'ひのえ',   on:'へい', go:'火', eto:'兄'},
  {k:'丁', kun:'ひのと',   on:'てい', go:'火', eto:'弟'},
  {k:'戊', kun:'つちのえ', on:'ぼ',   go:'土', eto:'兄'},
  {k:'己', kun:'つちのと', on:'き',   go:'土', eto:'弟'},
  {k:'庚', kun:'かのえ',   on:'こう', go:'金', eto:'兄'},
  {k:'辛', kun:'かのと',   on:'しん', go:'金', eto:'弟'},
  {k:'壬', kun:'みずのえ', on:'じん', go:'水', eto:'兄'},
  {k:'癸', kun:'みずのと', on:'き',   go:'水', eto:'弟'},
];
/* ===== 十二支（じゅうにし） ===== */
const BRANCHES = [
  {k:'子', kun:'ね',    animal:'ねずみ'},
  {k:'丑', kun:'うし',  animal:'うし'},
  {k:'寅', kun:'とら',  animal:'とら'},
  {k:'卯', kun:'う',    animal:'うさぎ'},
  {k:'辰', kun:'たつ',  animal:'たつ（龍）'},
  {k:'巳', kun:'み',    animal:'へび'},
  {k:'午', kun:'うま',  animal:'うま'},
  {k:'未', kun:'ひつじ',animal:'ひつじ'},
  {k:'申', kun:'さる',  animal:'さる'},
  {k:'酉', kun:'とり',  animal:'とり'},
  {k:'戌', kun:'いぬ',  animal:'いぬ'},
  {k:'亥', kun:'い',    animal:'いのしし'},
];
/* ===== 60通りの音読み（連声をふくむ） 第1番→第60番 ===== */
const ON = [
 'こうし','いっちゅう','へいいん','ていぼう','ぼしん','きし','こうご','しんび','じんしん','きゆう',
 'こうじゅつ','いつがい','へいし','ていちゅう','ぼいん','きぼう','こうしん','しんし','じんご','きび',
 'こうしん','いつゆう','へいじゅつ','ていがい','ぼし','きちゅう','こういん','しんぼう','じんしん','きし',
 'こうご','いつび','へいしん','ていゆう','ぼじゅつ','きがい','こうし','しんちゅう','じんいん','きぼう',
 'こうしん','いっし','へいご','ていび','ぼしん','きゆう','こうじゅつ','しんがい','じんし','きちゅう',
 'こういん','いつぼう','へいしん','ていし','ぼご','きび','こうしん','しんゆう','じんじゅつ','きがい'
];
/* ===== 五行の色 ===== */
const GOCOLOR = {'木':'var(--moku)','火':'var(--ka)','土':'var(--do)','金':'var(--kin)','水':'var(--sui)'};
/* ===== 豆知識（有名なものだけ） ===== */
const MAME = {
  '甲子':'この年に <b>甲子園球場</b> ができました（1924年）。「かっし」とも読みます。',
  '戊辰':'明治のはじめの <b>戊辰戦争</b>（1868年）。',
  '壬申':'古代の <b>壬申の乱</b>（672年）。',
  '乙巳':'大化の改新の <b>乙巳の変</b>（645年）。',
  '丙午':'「<b>ひのえうま</b>」の年は昔から言い伝えがあります。',
  '庚申':'「<b>庚申待（こうしんまち）</b>」の夜ふかしの行事で知られます。',
  '辛亥':'中国の <b>辛亥革命</b>（1911年）。',
  '甲寅':'順番の中ほど。ここから十干がふたまわり目に入ります。',
  '癸亥':'60通りの <b>いちばん最後</b>。次はまた甲子にもどって「還暦（かんれき）」です。'
};

/* ===== 60通りを組み立て ===== */
const COMBOS = [];
for(let n=0;n<60;n++){
  const s = STEMS[n%10], b = BRANCHES[n%12];
  COMBOS.push({no:n+1, k:s.k+b.k, s, b, on:ON[n]});
}

/* ===== 状態 ===== */
let mode = 'random';
let idx = 0;          // 現在の COMBOS 添字
let revealed = false;
let bag = [];         // ランダム用のふくろ
let seen = 0;         // 今の一巡で見た枚数

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function refillBag(){bag = shuffle([...Array(60).keys()]);}

/* ===== 表示 ===== */
const $ = id => document.getElementById(id);

function render(){
  const c = COMBOS[idx];
  $('no').textContent = '第' + c.no + '番';
  $('kanji').textContent = c.k;

  // カウンタ
  if(mode==='order'){ $('count').textContent = c.no + '／60'; }
  else { $('count').textContent = seen + '／60'; }

  // 答え
  const yomi = c.s.kun + '<span class="dot">・</span>' + c.b.kun;
  $('yomi').innerHTML = yomi;
  $('onyomi').innerHTML = '音読み　<b>' + c.on + '</b>';
  $('breakdown').innerHTML =
    '<div class="row"><span class="badge" style="background:'+GOCOLOR[c.s.go]+'">'+c.s.k+'</span>'+
      '<span class="txt">'+c.s.kun+'　＝　'+c.s.go+'の'+c.s.eto+'（'+(c.s.eto==='兄'?'え':'と')+'）'+
      '<small>十干（じっかん）／五行は「'+c.s.go+'」</small></span></div>'+
    '<div class="row"><span class="badge" style="background:#8a7c66">'+c.b.k+'</span>'+
      '<span class="txt">'+c.b.kun+'　＝　'+c.b.animal+
      '<small>十二支（じゅうにし）</small></span></div>';

  const mame = MAME[c.k];
  if(mame){ $('mame').innerHTML = mame; $('mame').style.display='block'; }
  else { $('mame').style.display='none'; }

  // 見た目リセット
  revealed = false;
  $('answer').classList.remove('show');
  $('ask').style.display='block';
  $('revealBtn').style.display='block';
  $('nextBtn').style.display='none';
}

function reveal(){
  if(revealed) return;
  revealed = true;
  $('answer').classList.add('show');
  $('ask').style.display='none';
  $('revealBtn').style.display='none';
  $('nextBtn').style.display='block';
}

function next(){
  if(mode==='order'){
    idx = (idx+1)%60;
  } else {
    if(bag.length===0){ refillBag(); seen=0; }
    idx = bag.pop();
    seen++;
  }
  render();
}

function setMode(m){
  mode = m;
  $('mRandom').classList.toggle('on', m==='random');
  $('mOrder').classList.toggle('on', m==='order');
  if(m==='order'){ idx=0; }
  else { refillBag(); seen=1; idx=bag.pop(); }
  render();
}

/* ===== 操作 ===== */
$('revealBtn').addEventListener('click', reveal);
$('nextBtn').addEventListener('click', next);
$('fuda').addEventListener('click', ()=>{ if(!revealed) reveal(); });
$('mRandom').addEventListener('click', ()=>setMode('random'));
$('mOrder').addEventListener('click', ()=>setMode('order'));

/* 初期化：ランダムで1枚 */
refillBag(); seen=1; idx=bag.pop(); render();
</script>
</body>
</html>
